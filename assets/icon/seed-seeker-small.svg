<!-- Seed Seeker mark, small-size master: a reduced 14x14 chest for 48px and
     below, where the full 28x27 sprite cannot land on whole pixels and
     downsampling mushes the straps. A cell is 64pt of 1024, so it stays crisp
     at 16, 32 and 48px. See assets/icon/ATTRIBUTION.md. -->
