      <stop offset="1" stop-color="#071D48"/>
    </linearGradient>
    <clipPath id="plate">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#paper)"/>
  <g clip-path="url(#plate)" stroke="#FFFFFF" stroke-width="2" opacity="0.16" fill="none">
