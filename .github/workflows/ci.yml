name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep main's history complete; only supersede pull request builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build browser engine
        run: ./scripts/build-web-wasm.sh

      - name: Test and build web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The GTK crate needs GTK 4.22 and libadwaita 1.9 system libraries,
      # which this runner image predates; the linux-app job covers it.
      - name: Lint workspace
        run: cargo clippy --locked --workspace --exclude shpd-seedfinder-gtk --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace --exclude shpd-seedfinder-gtk

  linux-app:
    name: Linux
    runs-on: ubuntu-latest
    # Fedora ships the GTK 4.22 and libadwaita 1.9 stack the app targets.
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30

    steps:
      - name: Install system dependencies
        run: >-
          dnf install -y gcc git tar xz gtk4-devel libadwaita-devel
          pkgconf-pkg-config desktop-file-utils appstream

      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-app

      - name: Lint app
        run: cargo clippy --locked -p shpd-seedfinder-gtk --all-targets -- -D warnings

      - name: Test app
        run: cargo test --locked -p shpd-seedfinder-gtk

      - name: Validate desktop entry
        run: desktop-file-validate linux/data/dev.seedseeker.SeedSeeker.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net linux/data/dev.seedseeker.SeedSeeker.metainfo.xml

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The preview build posts its download link back to the pull request.
    permissions:
      contents: read
      pull-requests: write

    # Distribution activates once the service account secret exists; without it
    # the preview is still built and uploaded as a workflow artifact. Fork pull
    # requests never receive secrets, so they always take the artifact path.
    # The app ID and project are not secrets — they identify, they do not grant.
    env:
      HAVE_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      FIREBASE_PROJECT: shpd-seed-seeker
      FIREBASE_APP_ID: "1:994180159459:android:c16e6de2b2fb6b3d70b2d6"
      FIREBASE_TESTER_GROUP: preview-testers

    steps:
      - uses: actions/checkout@v6

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      # Must match ndkVersion in android/app/build.gradle.kts. The runner
      # image exports ANDROID_NDK_HOME pointing at its bundled NDK, so it has
      # to be repointed or scripts/build-android-native.sh links with the
      # wrong toolchain.
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and assemble release
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      # An installable build of the pull request, for hand-testing on a device.
      # It carries its own application ID, so it sits alongside an installed
      # release rather than colliding with it.
      - name: Assemble preview APK
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew :app:assemblePreview --stacktrace

      - name: Name the preview APK after the pull request
        if: github.event_name == 'pull_request'
        run: |
          cp android/app/build/outputs/apk/preview/app-preview.apk \
            "seed-seeker-pr${{ github.event.number }}-android.apk"

      - name: Upload preview APK
        id: preview_apk
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk
          path: seed-seeker-pr*-android.apk
          if-no-files-found: error

      # App Distribution gives testers a tap-to-install link, which a workflow
      # artifact cannot: GitHub serves those as a zip, to signed-in users only.
      # firebase-tools is pinned because an unpinned npx pulls a new major
      # without warning, and this step holds a credential.
      - name: Distribute preview APK to testers
        id: distribute
        if: github.event_name == 'pull_request' && env.HAVE_FIREBASE == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NUMBER: ${{ github.event.number }}
          TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          trap 'rm -f "$key"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          npx --yes firebase-tools@15.23.0 appdistribution:distribute \
            "seed-seeker-pr$NUMBER-android.apk" \
            --project "$FIREBASE_PROJECT" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUP" \
            --release-notes "PR #$NUMBER · $TITLE · ${SHA:0:7}" \
            | tee distribute.log
          # Prefer the per-release tester page; fall back to the app's release
          # list if the CLI ever stops printing that line.
          # `|| true` matters: under pipefail a non-matching grep would abort
          # the step rather than fall through to the app-level link.
          url=$(grep -o 'https://appdistribution\.firebase\.google\.com/testerapps/[^ ?]*' distribute.log | head -n 1 || true)
          echo "tester-url=${url:-https://appdistribution.firebase.google.com/testerapps/$FIREBASE_APP_ID}" >> "$GITHUB_OUTPUT"

      # One comment per pull request, rewritten in place on every push, so the
      # link always points at the newest build instead of piling up.
      - name: Comment the preview APK link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.number }}
          ARTIFACT_URL: ${{ steps.preview_apk.outputs.artifact-url }}
          TESTER_URL: ${{ steps.distribute.outputs.tester-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker='<!-- preview-apk -->'
          footer='Installed as `dev.seedseeker.unofficial.preview` and signed with the repository preview key, so it runs alongside a release build instead of replacing it.'
          if [ -n "$TESTER_URL" ]; then
            body=$(printf '%s\n**Preview APK** for `%s` — [install on a device](%s)\n\nOpen it on the phone and tap Download; you need to be in the `%s` group. Also on this run as a [`.zip` artifact](%s).\n\n%s\n' \
              "$marker" "${SHA:0:7}" "$TESTER_URL" "$FIREBASE_TESTER_GROUP" "$ARTIFACT_URL" "$footer")
          else
            body=$(printf '%s\n**Preview APK** for `%s` — [download](%s)\n\nGitHub serves artifacts as a `.zip`; extract it and install the `.apk` inside.\n\n%s\n' \
              "$marker" "${SHA:0:7}" "$ARTIFACT_URL" "$footer")
          fi
          # --paginate emits one array per page, so collapse to a single id.
          id=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" >/dev/null
          fi

  macos:
    name: macOS
    # Matches the release macos-app job so tests exercise the shipping SDK.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos

      - name: Build native library
        run: bash scripts/build-macos-native.sh

      - name: Test Swift package
        working-directory: macos/SeedSeeker
        run: swift test

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # The GTK app is Linux-only; its system libraries do not exist here.
      - name: Test workspace
        run: cargo test --locked --workspace --exclude shpd-seedfinder-gtk

      # The csproj builds and copies the Rust engine DLL itself.
      - name: Build app
        run: pwsh scripts/build-windows-app.ps1 -Platform x64
