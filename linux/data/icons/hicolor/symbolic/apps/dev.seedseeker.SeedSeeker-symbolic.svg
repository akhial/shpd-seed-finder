<!-- Symbolic form of the Seed Seeker mark: the chest's ironwork in one
     recolourable tone, reduced for 16px. Shipped both in the hicolor theme
     and in the GResource bundle, because the About dialog resolves APP_ID
     through the bundle on uninstalled builds.
     See assets/icon/ATTRIBUTION.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#2e3436" shape-rendering="crispEdges">
    <rect x="1" y="1" width="2" height="3"/>
    <rect x="7" y="1" width="2" height="3"/>
    <rect x="13" y="1" width="2" height="3"/>
    <rect x="1" y="4" width="2" height="2"/>
    <rect x="7" y="4" width="2" height="2"/>
    <rect x="13" y="4" width="2" height="2"/>
    <rect x="1" y="6" width="2" height="3"/>
    <rect x="7" y="6" width="2" height="1"/>
    <rect x="13" y="6" width="2" height="3"/>
    <rect x="4" y="7" width="8" height="1"/>
    <rect x="5" y="8" width="1" height="1"/>
    <rect x="6" y="8" width="4" height="1"/>
    <rect x="10" y="8" width="1" height="1"/>
    <rect x="1" y="9" width="6" height="2"/>
    <rect x="9" y="9" width="6" height="2"/>
    <rect x="2" y="11" width="1" height="3"/>
    <rect x="6" y="11" width="1" height="1"/>
    <rect x="9" y="11" width="1" height="1"/>
    <rect x="13" y="11" width="1" height="3"/>
    <rect x="6" y="12" width="4" height="1"/>
    <rect x="2" y="14" width="12" height="1"/>
  </g>
</svg>
